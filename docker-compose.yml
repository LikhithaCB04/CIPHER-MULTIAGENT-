services:
  master-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: master-orchestrator
    ports:
    - 8000:8000
    depends_on:
      ai-specialist-agent:
        condition: service_healthy
      deepthi-agent:
        condition: service_healthy
      likitha-agent:
        condition: service_healthy
      mahima-agent:
        condition: service_healthy
      ayesha-agent:
        condition: service_healthy
    environment:
    - CHOKIDAR_USEPOLLING=true
    - VITE_API_URL=http://localhost:8000
    - DATA_SCIENCE_HOST=deepthi-agent
    - FULLSTACK_HOST=ayesha-agent
    - SECURITY_HOST=mahima-agent
    - DEVOPS_HOST=likitha-agent
    - AI_SPECIALIST_HOST=ai-specialist-agent
    restart: unless-stopped
    env_file:
    - .env
  ai-specialist-agent:
    build:
      context: ./agents/ai_specialist
      dockerfile: Dockerfile
    container_name: ai-specialist-agent
    ports:
    - 8005:8005
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health',
        timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    env_file:
    - .env
  deepthi-agent:
    build:
      context: ./agents/deepthi_data
      dockerfile: Dockerfile
    container_name: deepthi-agent
    ports:
    - 8001:8001
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',
        timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    env_file:
    - .env
  likitha-agent:
    build:
      context: ./agents/likitha_devops
      dockerfile: Dockerfile
    container_name: likitha-agent
    ports:
    - 8004:8004
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health',
        timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    env_file:
    - .env
  mahima-agent:
    build:
      context: ./agents/mahima_security
      dockerfile: Dockerfile
    container_name: mahima-agent
    ports:
    - 8003:8003
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health',
        timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    env_file:
    - .env
  ayesha-agent:
    build:
      context: ./agents/ayeesha_fullstack
      dockerfile: Dockerfile
    container_name: ayesha-agent
    ports:
    - 8002:8002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health',
        timeout=5).read()
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    env_file:
    - .env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cipher-frontend
    ports:
    - 5173:5173
    environment:
    - VITE_API_URL=http://localhost:8000
    depends_on:
    - master-orchestrator
    restart: unless-stopped
