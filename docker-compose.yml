

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull phi3"]
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: master-orchestrator
    ports:
      - '8000:8000'
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      deepthi-data-agent:
        condition: service_healthy
      ayeesha-fullstack-agent:
        condition: service_healthy
      mahima-security-agent:
        condition: service_healthy
      likitha-devops-agent:
        condition: service_healthy
      ai-specialist-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  deepthi-data-agent:
    build:
      context: ./agents/deepthi_data
      dockerfile: Dockerfile
    container_name: deepthi-data-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  ayeesha-fullstack-agent:
    build:
      context: .
      dockerfile: agents/ayeesha_fullstack/Dockerfile
    container_name: ayeesha-fullstack-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  mahima-security-agent:
    build:
      context: .
      dockerfile: agents/mahima_security/Dockerfile
    container_name: mahima-security-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  likitha-devops-agent:
    build:
      context: ./agents/likitha_devops
      dockerfile: Dockerfile
    container_name: likitha-devops-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./agents/likitha_devops:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  ai-specialist-agent:
    build:
      context: .
      dockerfile: agents/ai_specialist/Dockerfile
    container_name: ai-specialist-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - '5173:5173'
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  ollama_models:
