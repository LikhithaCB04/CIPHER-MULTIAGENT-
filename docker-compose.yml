services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  init-ollama:
    image: ollama/ollama:latest
    container_name: init-ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull phi3:mini
        ollama pull llama3.2:latest
        ollama pull nomic-embed-text
        ollama pull qwen2.5:3b
        ollama pull gemma2:2b
        ollama pull deepseek-r1:8b
    restart: "no"

  master-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: master-orchestrator
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      init-ollama:
        condition: service_completed_successfully
      ai-specialist-agent:
        condition: service_healthy
      deepthi-agent:
        condition: service_healthy
      likitha-agent:
        condition: service_healthy
      mahima-agent:
        condition: service_healthy
      ayesha-agent:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

  ai-specialist-agent:
    build:
      context: ./agents/ai_specialist
      dockerfile: Dockerfile
    container_name: ai-specialist-agent
    ports:
      - "8005:8005"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  deepthi-agent:
    build:
      context: ./agents/deepthi_data
      dockerfile: Dockerfile
    container_name: deepthi-agent
    ports:
      - "8006:8006"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  likitha-agent:
    build:
      context: ./agents/likitha_devops
      dockerfile: Dockerfile
    container_name: likitha-agent
    ports:
      - "8007:8007"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  mahima-agent:
    build:
      context: ./agents/mahima_security
      dockerfile: Dockerfile
    container_name: mahima-agent
    ports:
      - "8008:8008"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  ayesha-agent:
    build:
      context: ./agents/ayeesha_fullstack
      dockerfile: Dockerfile
    container_name: ayesha-agent
    ports:
      - "8009:8009"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

volumes:
  ollama_models:
